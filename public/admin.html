<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090b14;color:white}*{box-sizing:border-box}body{margin:0;padding:28px;background:radial-gradient(circle at 80% 0,rgba(139,92,246,.16),transparent 30%)}[hidden]{display:none!important}.login{max-width:420px;margin:12vh auto;padding:26px;border:1px solid #272b40;border-radius:18px;background:#121521}.panel{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.table{padding:18px;border:1px solid #272b40;border-radius:14px;background:#121521}.card strong{font-size:30px}label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700}input{width:100%;height:43px;border:1px solid #272b40;border-radius:9px;background:#0c0e18;color:white;padding:0 12px}button{height:40px;padding:0 14px;border:1px solid #353950;border-radius:9px;background:#1d2031;color:white;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:16px;border:0;background:#825cf4}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 8px;border-bottom:1px solid #272b40;text-align:left}th{color:#979bb1;font-size:11px;text-transform:uppercase}.status{padding:4px 8px;border-radius:99px;background:#23263a}.tools{display:flex;gap:8px;margin-bottom:16px}.tools input{max-width:260px}.message{color:#fda4af;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start}body{padding:16px}}</style></head><body>
<section class="login" id="login"><h1>Admin access</h1><p class="message">Owner and CEO only.</p><form id="login-form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary">Sign in securely</button></form><div class="message" id="message"></div></section>
<main class="panel" id="panel" hidden><div class="head"><div><p>BIGSMALL CONTROL</p><h1>Administration</h1></div><button id="logout">Logout</button></div><div class="grid"><article class="card">Users<strong id="users-count">0</strong></article><article class="card">Active<strong id="active-count">0</strong></article><article class="card">Pending<strong id="pending-count">0</strong></article><article class="card">Predictions<strong id="prediction-count">0</strong></article></div><section class="table"><h2>User management</h2><div class="tools"><input id="search" placeholder="Search name or email"><button id="refresh">Search</button></div><div class="wrap"><table><thead><tr><th>User</th><th>Status</th><th>Expiry</th><th>Coins</th><th>Actions</th></tr></thead><tbody id="user-list"></tbody></table></div></section><section class="table" style="margin-top:16px"><h2>Recent audit log</h2><div class="wrap"><table><thead><tr><th>Action</th><th>Details</th><th>Time</th></tr></thead><tbody id="audit-list"></tbody></table></div></section></main>
<script>
async function api(url,options={}){const r=await fetch(url,{...options,headers:{...options.headers,"Content-Type":"application/json"}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function login(e){e.preventDefault();try{const d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});if(!["owner","ceo","admin"].includes(d.user.role))throw new Error("Admin permission required.");show()}catch(e){message.textContent=e.message}}loginForm=document.querySelector("#login-form");loginForm.onsubmit=login;
async function load(){try{const o=await api("/api/admin/overview");document.querySelector("#users-count").textContent=o.users;document.querySelector("#active-count").textContent=o.active;document.querySelector("#pending-count").textContent=o.pending;document.querySelector("#prediction-count").textContent=o.predictions;const searchValue=document.querySelector("#search").value;const u=await api("/api/admin/users?search="+encodeURIComponent(searchValue));document.querySelector("#user-list").innerHTML=u.users.length?u.users.map(x=>`<tr><td><strong>${x.name}</strong><br>${x.email}</td><td><span class="status">${x.status}</span></td><td><input type="date" value="${x.expires_at||""}" data-expiry="${x.id}"></td><td><input type="number" value="${x.coins}" style="width:90px" data-coins="${x.id}"><button data-adjust="${x.id}">Ledger +/−</button></td><td><button data-status="${x.id}" data-value="active">Approve</button> <button data-status="${x.id}" data-value="disabled">Disable</button></td></tr>`).join(""):"<tr><td colspan='5'>No matching users.</td></tr>";const a=await api("/api/admin/audit");document.querySelector("#audit-list").innerHTML=a.logs.map(x=>`<tr><td>${x.action}</td><td>${x.details||""}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join("")}catch(e){location="/"}}
async function show(){login.hidden=true;panel.hidden=false;await load()}
user-list.onclick=async e=>{try{if(e.target.dataset.status){await api("/api/admin/users/"+e.target.dataset.status,{method:"PATCH",body:JSON.stringify({status:e.target.dataset.value})});load()}if(e.target.dataset.adjust){const row=e.target.closest("tr"),input=row.querySelector("[data-coins]"),amount=Number(input.value)-Number(input.defaultValue);if(!amount)return;await api("/api/admin/users/"+e.target.dataset.adjust+"/coins",{method:"POST",body:JSON.stringify({amount,reason:"Manual admin balance adjustment"})});load()}}catch(e){alert(e.message)}};
user-list.onchange=async e=>{if(!e.target.dataset.expiry)return;try{await api("/api/admin/users/"+e.target.dataset.expiry,{method:"PATCH",body:JSON.stringify({expires_at:e.target.value})})}catch(e){alert(e.message)}};
refresh.onclick=load;logout.onclick=async()=>{await api("/api/auth/logout",{method:"POST",body:"{}"});location="/"};(async()=>{try{const d=await api("/api/me");if(["owner","ceo","admin"].includes(d.user.role))show()}catch{}})();
</script></body></html>
